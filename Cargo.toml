[workspace]
members = [
    "crates/layerzero-core",
    "crates/layerzero-server",
    "crates/layerzero-cli",
    "crates/layerzero-mcp",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "multipart", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "json", "chrono", "uuid", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = { version = "0.4", features = ["util"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
async-trait = "0.1"
config = "0.14"
dirs = "5"
indicatif = "0.17"
flate2 = "1"
tar = "0.4"
zip = "2"
bytes = "1"
toml = "0.8"
layerzero-core = { path = "crates/layerzero-core" }
