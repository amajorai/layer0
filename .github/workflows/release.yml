name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked

      - name: Build release binaries (cargo)
        if: matrix.use_cross == false
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p layerzero -p layerzero-server -p layerzero-mcp

      - name: Build release binaries (cross)
        if: matrix.use_cross == true
        run: >-
          cross build --release --locked --target ${{ matrix.target }}
          -p layerzero -p layerzero-server -p layerzero-mcp

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="target/${{ matrix.target }}/release"
          ARCHIVE="layerzero-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE" \
            -C "$BIN_DIR" \
            layerzero layerzero-server layerzero-mcp
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "target/${{ matrix.target }}/release"
          $archive = "layerzero-${{ matrix.target }}.zip"
          $files = @(
            "$binDir/layerzero.exe",
            "$binDir/layerzero-server.exe",
            "$binDir/layerzero-mcp.exe"
          )
          Compress-Archive -Path $files -DestinationPath $archive -Force
          "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: layerzero-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/layerzero-*.tar.gz
            artifacts/**/layerzero-*.zip
